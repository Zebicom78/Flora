<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Stylized Architectural Botanical Monogram -->
  <g transform="translate(10, 10)">
    <!-- Base arch -->
    <path d="M10 52 C 10 26, 50 26, 50 52" stroke="#153D2B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M16 52 C 16 32, 44 32, 44 52" stroke="#C9A65A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Central Flora Petal / Spire -->
    <path d="M30 6 C24 16, 24 28, 30 40 C36 28, 36 16, 30 6 Z" fill="#153D2B"/>
    <!-- Left Blossom Petal -->
    <path d="M30 22 C20 18, 12 24, 14 34 C18 36, 26 32, 30 26 Z" fill="#C9A65A"/>
    <!-- Right Blossom Petal -->
    <path d="M30 22 C40 18, 48 24, 46 34 C42 36, 34 32, 30 26 Z" fill="#C9A65A"/>
    <!-- Golden Core Accent -->
    <circle cx="30" cy="24" r="2.5" fill="#C9A65A"/>
    <!-- Foundation Baseline -->
    <line x1="6" y1="52" x2="54" y2="52" stroke="#153D2B" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Typography -->
  <text x="80" y="42" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="3" fill="#153D2B">FLORA CITY</text>
  <text x="82" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="4" fill="#C9A65A">ESTATES &amp; RESIDENCES</text>
</svg>
